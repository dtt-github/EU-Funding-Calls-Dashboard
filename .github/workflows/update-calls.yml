name: Update EU Funding Calls

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync local main with origin
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch latest calls from EU SEDIA API
        run: python3 scripts/fetch_calls.py

      # Open a PR instead of pushing to main — branch protection that requires
      # pull requests blocks direct pushes from GITHUB_TOKEN (often reported
      # as "fetch first" / non-fast-forward).
      # Note: bash uses `set -e`; `git diff --quiet` exits 1 when the file
      # differs, so use `if`, not `&&`.
      - name: Open pull request if data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet data/calls.json; then
            echo "No changes to data/calls.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/update-calls-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add data/calls.json
          git commit -m "Auto-update call data from EU SEDIA API"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Auto-update call data from EU SEDIA API" \
            --body "Scheduled or manual workflow refreshed \`data/calls.json\` from the EU SEDIA API. Please review and merge to publish updated data on GitHub Pages."
