# Refreshes data/calls.json from the EU SEDIA API and opens a PR into main.
#
# Required repo settings (often why this fails with no PR):
#   Settings → Actions → General → Workflow permissions:
#     - "Read and write permissions"
#     - Enable "Allow GitHub Actions to create and approve pull requests"
#
# If pushes/PRs still fail (e.g. strict org policy), add a repository secret
# DATA_UPDATE_TOKEN: fine-grained PAT with Contents + Pull requests (write)
# on this repo only. The workflow uses it in place of GITHUB_TOKEN when set.

name: Update EU Funding Calls

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DATA_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync local main with origin
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch latest calls from EU SEDIA API
        run: python3 scripts/fetch_calls.py

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DATA_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          add-paths: data/calls.json
          commit-message: Auto-update call data from EU SEDIA API
          branch: auto/update-calls-data
          base: main
          title: Auto-update call data from EU SEDIA API
          body: |
            This PR updates `data/calls.json` from the EU SEDIA API (scheduled or manual workflow).

            **Merge** to publish the new dataset on GitHub Pages.

            If this workflow keeps failing with no PR, check **Settings → Actions → General**:
            workflow permissions must be **Read and write**, and **Allow GitHub Actions to create and approve pull requests** must be enabled. As a fallback, add a `DATA_UPDATE_TOKEN` repository secret (see comments at the top of `update-calls.yml`).

      - name: Log PR result
        if: always()
        run: |
          echo "pull-request-operation=${{ steps.cpr.outputs.pull-request-operation }}"
          echo "pull-request-url=${{ steps.cpr.outputs.pull-request-url }}"
          echo "pull-request-number=${{ steps.cpr.outputs.pull-request-number }}"
