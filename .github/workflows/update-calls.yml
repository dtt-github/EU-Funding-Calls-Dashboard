name: Update EU Funding Calls

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch latest calls from EU SEDIA API
        run: python3 scripts/fetch_calls.py

      # Note: bash runs with `set -e`. `git diff --quiet` exits 1 when the file
      # *differs* — so we must use `if`, not `&&`, or the job fails when there
      # are changes to commit.
      - name: Commit and push if data changed
        run: |
          if git diff --quiet data/calls.json; then
            echo "No changes to data/calls.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add data/calls.json
          git commit -m "Auto-update call data from EU SEDIA API"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin main; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); remote may have moved — retrying…"
            sleep $((attempt * 10))
          done
          echo "Push failed after 5 attempts"
          exit 1
